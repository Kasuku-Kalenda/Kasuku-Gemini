# ─── Nginx — Kasuku STAGING (kasuku.afrikia.org) ──────────────────────────
#
# SSL géré par Coolify/Traefik en amont.
# Ce fichier gère uniquement le routing HTTP interne entre les services.
#
# Routing :
#   /api/*        → api:4000
#   /api/v1/upload → api:4000 (limite de taux spécifique)
#   /storage/*    → minio:9000 (fichiers publics)
#   /immersive    → kasuku-immersive:3001 (Next.js)
#   /*            → frontend:80 (SPA React/Vite)

upstream api_upstream {
    server api:4000;
    keepalive 64;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

upstream immersive_upstream {
    server kasuku-immersive:3001;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=120r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    client_body_timeout  120s;

    # Headers de sécurité (Coolify ajoute HSTS via Traefik)
    add_header X-Frame-Options         SAMEORIGIN                          always;
    add_header X-Content-Type-Options  nosniff                             always;
    add_header X-XSS-Protection        "1; mode=block"                     always;
    add_header Referrer-Policy         strict-origin-when-cross-origin     always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Auth (rate limité strictement) ───────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Upload ────────────────────────────────────────────────────────────────
    location /api/v1/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        client_max_body_size 512M;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── MinIO — fichiers publics ──────────────────────────────────────────────
    location /storage/ {
        rewrite ^/storage/(.*)$ /kasuku-staging-media/$1 break;
        proxy_pass http://minio_upstream;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Kasuku Immersive (Next.js) ────────────────────────────────────────────
    location /immersive {
        proxy_pass http://immersive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Health check Coolify ──────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
