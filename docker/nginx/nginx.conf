# ─── Nginx — Reverse Proxy Kasuku (dev / staging) ────────────────────────────
#
# Routing:
#   /api/v1/*   → api:4000
#   /storage/*  → minio:9000  (accès public aux fichiers uploadés)
#   /*          → frontend:80
#
# En production, remplacer ce fichier par nginx.prod.conf

upstream api_upstream {
    server api:4000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 8;
}

upstream immersive_upstream {
    server kasuku-immersive:3001;
    keepalive 8;
}

# ─── Limite de taux (protection DoS basique) ─────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Taille max upload (médias, SCORM, H5P)
    client_max_body_size 512M;
    client_body_timeout 120s;

    # Headers de sécurité
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── Upload (limite de taux spécifique) ───────────────────────────────────
    location /api/v1/upload {
        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 512M;
    }

    # ── MinIO — fichiers publics ──────────────────────────────────────────────
    location /storage/ {
        rewrite ^/storage/(.*)$ /kasuku-media/$1 break;
        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Cache agressif pour les médias
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Kasuku Immersive (Next.js) ───────────────────────────────────────────
    location /immersive {
        proxy_pass http://immersive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Frontend (SPA) ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
