# ─── Nginx — Reverse Proxy Kasuku (PRODUCTION) ───────────────────────────────
#
# Différences avec dev:
#   • HTTPS + redirection HTTP → HTTPS
#   • HSTS
#   • Cache plus agressif
#   • Logs structurés
#   • Certificats Let's Encrypt (Certbot) montés depuis /etc/letsencrypt
#
# Pour générer les certificats:
#   certbot certonly --webroot -w /var/www/certbot -d kasuku.app -d www.kasuku.app

upstream api_upstream {
    server api:4000;
    keepalive 64;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name kasuku.app www.kasuku.app;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kasuku.app www.kasuku.app;

    ssl_certificate     /etc/letsencrypt/live/kasuku.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasuku.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (6 mois)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 512M;

    # ── Auth (rate limité plus strictement) ──────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── Upload ────────────────────────────────────────────────────────────────
    location /api/v1/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 512M;
    }

    # ── MinIO ─────────────────────────────────────────────────────────────────
    location /storage/ {
        rewrite ^/storage/(.*)$ /kasuku-media/$1 break;
        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
