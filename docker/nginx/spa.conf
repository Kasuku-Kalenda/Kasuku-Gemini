# Nginx config pour servir le SPA React (Vite build)
# Toute route inconnue → index.html pour que React Router prend le relais

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;

    # Cache agressif pour les assets hachés (JS/CSS/fonts)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # manifest.json et service-worker: pas de cache
    location ~* (manifest\.json|service-worker\.js)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Toutes les autres routes → index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
