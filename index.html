<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Kasuku Cultural Calendar</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E67E22" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/8cYFbspt/Kasuku-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#E67E22',
                    secondary: '#0E6251',
                    accent: '#F1C40F',
                    light: '#FAF8F5',
                    dark: '#2C3E50',
                    border: 'hsl(20, 5.9%, 90%)',
                    input: 'hsl(20, 5.9%, 90%)',
                    ring: 'hsl(25, 83.3%, 57.8%)',
                    background: 'hsl(36, 44%, 96%)',
                    foreground: 'hsl(215, 28%, 17%)',
                    card: 'hsl(0, 0%, 100%)',
                    'card-foreground': 'hsl(215, 28%, 17%)',
                    'popover': 'hsl(0, 0%, 100%)',
                    'popover-foreground': 'hsl(215, 28%, 17%)',
                    'primary-foreground': 'hsl(0, 0%, 100%)',
                    'secondary-foreground': 'hsl(0, 0%, 100%)',
                    'muted': 'hsl(210, 40%, 96.1%)',
                    'muted-foreground': 'hsl(215.4, 16.3%, 46.9%)',
                    'accent-foreground': 'hsl(215, 28%, 17%)',
                    'destructive': 'hsl(0, 84.2%, 60.2%)',
                    'destructive-foreground': 'hsl(0, 0%, 100%)',
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                },
                borderRadius: {
                    '2xl': '1rem',
                    lg: '0.5rem',
                    md: 'calc(0.5rem - 2px)',
                    sm: 'calc(0.5rem - 4px)'
                },
                boxShadow: {
                    soft: '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                    't-lg': '0 -4px 6px -1px rgba(0, 0, 0, 0.1), 0 -2px 4px -2px rgba(0, 0, 0, 0.1)',
                }
            }
        }
    }
    </script>
    <style>
      body {
        background-color: #FAF8F5;
        color: #2C3E50;
        font-family: 'Inter', sans-serif;
      }
      .day.selected {
        background-color: #E67E22 !important;
        color: white !important;
        border-radius: 9999px;
      }
      .day:not([disabled]):hover {
        background-color: #FDE6D4;
        border-radius: 9999px;
      }
    </style>
<script type="importmap">
{
  "imports": {

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "zod": "https://aistudiocdn.com/zod@^4.1.12",
    "react-hook-form": "https://aistudiocdn.com/react-hook-form@^7.66.0"
  }
}
</script>
<link rel="stylesheet" href="index.css">
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
