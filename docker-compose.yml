# ─── Kasuku — Docker Compose (développement) ─────────────────────────────────
#
# Démarrage rapide :
#   cp .env.example .env          # remplir les variables
#   docker compose up -d          # lancer tous les services
#   docker compose logs -f api    # suivre les logs de l'API
#
# Ordre de démarrage :
#   postgres → postgres-migrate → api → frontend + kasuku-immersive → nginx
#
# Services :
#   nginx            → :80              reverse proxy (entrée unique)
#   frontend         → via nginx        React SPA (Vite build)
#   api              → via nginx/api    REST API Node.js / Fastify
#   postgres         → :5432            PostgreSQL 16
#   postgres-migrate → (éphémère)       Applique les migrations au démarrage
#   redis            → :6379            Cache + sessions
#   minio            → :9000 / :9001    Object storage (console admin :9001)
#   minio-init       → (éphémère)       Crée le bucket MinIO au premier démarrage

name: kasuku

services:

  # ── Kasuku Immersive (Next.js) ────────────────────────────────────────────
  kasuku-immersive:
    build:
      context: ../kasuku-immersive
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /immersive
    environment:
      NODE_ENV:                production
      NEXT_PUBLIC_BASE_PATH:   /immersive
      NEXT_PUBLIC_BASE_URL:    http://kasuku-immersive:3001
      PORT:                    3001
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_USER:                 ${POSTGRES_USER:-kasuku}
      DB_PASSWORD:             ${POSTGRES_PASSWORD}
      DB_NAME:                 ${POSTGRES_DB:-kasuku_db}
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/immersive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      kasuku-immersive:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── Frontend (SPA React / Vite) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── API (Node.js / Fastify) ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV:               production
      DATABASE_URL:           postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:              ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET:             ${JWT_SECRET}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      MINIO_ENDPOINT:         ${MINIO_ENDPOINT:-minio}
      MINIO_PORT:             ${MINIO_PORT:-9000}
      MINIO_USE_SSL:          ${MINIO_USE_SSL:-false}
      MINIO_ROOT_USER:        ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:    ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:           ${MINIO_BUCKET:-kasuku-media}
      MINIO_PUBLIC_URL:       ${MINIO_PUBLIC_URL:-http://localhost/storage}
      CORS_ORIGINS:           ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      INITIAL_ADMIN_EMAIL:    ${INITIAL_ADMIN_EMAIL:-admin@kasuku.app}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME:     ${INITIAL_ADMIN_NAME:-Admin Kasuku}
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-kasuku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-kasuku_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"     # exposé en dev (DBeaver, TablePlus, psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasuku} -d ${POSTGRES_DB:-kasuku_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── Migrations PostgreSQL (service éphémère) ──────────────────────────────
  # Lance les 16 migrations dans l'ordre puis s'arrête.
  # Ne tourne qu'une fois par démarrage de la stack.
  # Si une migration échoue, l'API ne démarre pas.
  postgres-migrate:
    image: postgres:16-alpine
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER:-kasuku}
      PGDATABASE: ${POSTGRES_DB:-kasuku_db}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./docker/postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kasuku-net
    restart: on-failure

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"     # exposé en dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── MinIO (Object Storage S3-compatible) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-kasuku_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"     # API S3
      - "9001:9001"     # Console admin MinIO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - kasuku-net

  # ── MinIO Init (bucket créé une seule fois) ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-kasuku-media} &&
        mc anonymous set download local/$${MINIO_BUCKET:-kasuku-media} &&
        echo '✅  Bucket $${MINIO_BUCKET:-kasuku-media} prêt.'
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-kasuku_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET:-kasuku-media}
    networks:
      - kasuku-net
    restart: on-failure

# ─── Volumes persistants ──────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ─── Réseau interne ───────────────────────────────────────────────────────────
networks:
  kasuku-net:
    driver: bridge
