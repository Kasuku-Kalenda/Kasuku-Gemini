# ─── Kasuku — Docker Compose PRODUCTION ─────────────────────────────────────
#
# Utilisation:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Différences avec dev:
#   • HTTPS via nginx.prod.conf (Let's Encrypt)
#   • Ports internes uniquement (pas d'exposition directe de Mongo/Redis)
#   • Ressources limitées (CPU/RAM)
#   • Logging JSON structuré
#   • Redémarrage automatique
#   • NODE_ENV=production

name: kasuku

services:

  nginx:
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  api:
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  mongo:
    ports: []    # Ne plus exposer MongoDB en production
    command: mongod --auth --wiredTigerCacheSizeGB 1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    ports: []    # Ne plus exposer Redis en production
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    ports:
      - "9000:9000"  # S3 API (protégé par firewall, accès Nginx uniquement)
    # En prod, désactiver la console admin ou la restreindre par IP
    command: server /data --console-address ":9001" --address ":9000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
