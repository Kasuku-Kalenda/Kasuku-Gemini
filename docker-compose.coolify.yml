# ─── Kasuku — Docker Compose COOLIFY (kasuku.afrikia.org) ────────────────────
#
# Fichier UNIQUEMENT pour le déploiement via Coolify.
# Ne pas utiliser en local — utiliser docker-compose.yml à la place.
#
# Dans Coolify :
#   Base Directory       : /
#   Docker Compose File  : docker-compose.coolify.yml

name: kasuku-prod

services:

  # ── Kasuku Immersive (Next.js) — submodule ./kasuku-immersive ─────────────
  kasuku-immersive:
    build:
      context: ./kasuku-immersive
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /immersive
    environment:
      NODE_ENV:                production
      NEXT_PUBLIC_BASE_PATH:   /immersive
      NEXT_PUBLIC_BASE_URL:    https://kasuku.afrikia.org/immersive
      KASUKU_API_URL:          http://api:4000/api/v1
      PORT:                    3001
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_USER:                 ${POSTGRES_USER:-kasuku}
      DB_PASSWORD:             ${POSTGRES_PASSWORD}
      DB_NAME:                 ${POSTGRES_DB:-kasuku_db}
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/immersive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: always
    networks:
      - kasuku-net

  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      kasuku-immersive:
        condition: service_healthy
    restart: always
    networks:
      - kasuku-net

  # ── Frontend (SPA React / Vite) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://kasuku.afrikia.org/api/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - kasuku-net

  # ── API (Node.js / Fastify) ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV:               production
      DATABASE_URL:           postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:              redis://redis:6379
      JWT_SECRET:             ${JWT_SECRET}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      MINIO_ENDPOINT:         minio
      MINIO_PORT:             9000
      MINIO_USE_SSL:          false
      MINIO_ROOT_USER:        ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:    ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:           ${MINIO_BUCKET:-kasuku-media}
      MINIO_PUBLIC_URL:       https://kasuku.afrikia.org/storage
      CORS_ORIGINS:           https://kasuku.afrikia.org,capacitor://localhost,https://localhost
      INITIAL_ADMIN_EMAIL:    ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME:     ${INITIAL_ADMIN_NAME:-Admin Kasuku}
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: always
    networks:
      - kasuku-net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-kasuku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-kasuku_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasuku} -d ${POSTGRES_DB:-kasuku_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - kasuku-net

  # ── Migrations PostgreSQL ─────────────────────────────────────────────────
  postgres-migrate:
    image: postgres:16-alpine
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER:-kasuku}
      PGDATABASE: ${POSTGRES_DB:-kasuku_db}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./docker/postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kasuku-net
    restart: on-failure

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - kasuku-net

  # ── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - kasuku-net

  # ── MinIO Init ────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-kasuku-media} &&
        mc anonymous set download local/$${MINIO_BUCKET:-kasuku-media} &&
        echo 'Bucket pret.'
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET:-kasuku-media}
    networks:
      - kasuku-net
    restart: on-failure

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  kasuku-net:
    driver: bridge
