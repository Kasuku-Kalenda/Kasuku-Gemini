# ─── Kasuku — Docker Compose STAGING (staging.kasuku.afrikia.org) ────────────
#
# Déploiement automatique via GitHub Actions sur push main.
# Ne pas utiliser en local — utiliser docker-compose.yml à la place.

name: kasuku-staging

services:

  # ── Kasuku Immersive (Next.js) ────────────────────────────────────────────
  kasuku-immersive:
    build:
      context: ./kasuku-immersive
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /immersive
    environment:
      NODE_ENV:                production
      NEXT_PUBLIC_BASE_PATH:   /immersive
      NEXT_PUBLIC_BASE_URL:    https://staging.kasuku.afrikia.org/immersive
      KASUKU_API_URL:          http://api:4000/api/v1
      PORT:                    3001
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/immersive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: always
    networks:
      - kasuku-staging-net

  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kasuku-staging.rule=Host(`staging.kasuku.afrikia.org`)"
      - "traefik.http.routers.kasuku-staging.entrypoints=https"
      - "traefik.http.routers.kasuku-staging.tls=true"
      - "traefik.http.routers.kasuku-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.kasuku-staging.loadbalancer.server.port=80"
      - "traefik.http.routers.kasuku-staging-http.rule=Host(`staging.kasuku.afrikia.org`)"
      - "traefik.http.routers.kasuku-staging-http.entrypoints=http"
      - "traefik.http.routers.kasuku-staging-http.middlewares=kasuku-staging-https"
      - "traefik.http.middlewares.kasuku-staging-https.redirectscheme.scheme=https"
    volumes:
      - ./deploy/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      kasuku-immersive:
        condition: service_healthy
    restart: always
    networks:
      - kasuku-staging-net
      - coolify

  # ── Frontend (SPA React / Vite) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://staging.kasuku.afrikia.org/api/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - kasuku-staging-net

  # ── API (Node.js / Fastify) ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV:               production
      DATABASE_URL:           postgresql://${POSTGRES_USER:-kasuku}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kasuku_staging_db}
      REDIS_URL:              redis://redis:6379
      JWT_SECRET:             ${JWT_SECRET}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      MINIO_ENDPOINT:         minio
      MINIO_PORT:             9000
      MINIO_USE_SSL:          false
      MINIO_ROOT_USER:        ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:    ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:           kasuku-staging-media
      MINIO_PUBLIC_URL:       https://staging.kasuku.afrikia.org/storage
      CORS_ORIGINS:           https://staging.kasuku.afrikia.org
      INITIAL_ADMIN_EMAIL:    ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME:     ${INITIAL_ADMIN_NAME:-Admin Kasuku}
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: always
    networks:
      - kasuku-staging-net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-kasuku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-kasuku_staging_db}
    volumes:
      - pg_staging_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasuku} -d ${POSTGRES_DB:-kasuku_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - kasuku-staging-net

  # ── Migrations ─────────────────────────────────────────────────────────────
  postgres-migrate:
    image: postgres:16-alpine
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER:-kasuku}
      PGDATABASE: ${POSTGRES_DB:-kasuku_staging_db}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./docker/postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kasuku-staging-net
    restart: on-failure

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --loglevel warning
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - kasuku-staging-net

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - kasuku-staging-net

  # ── MinIO Init ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/kasuku-staging-media &&
        mc anonymous set download local/kasuku-staging-media &&
        echo 'Bucket staging pret.'
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - kasuku-staging-net
    restart: on-failure

volumes:
  pg_staging_data:
  redis_staging_data:
  minio_staging_data:

networks:
  kasuku-staging-net:
    driver: bridge
  coolify:
    external: true
